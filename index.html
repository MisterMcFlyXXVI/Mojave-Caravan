// ---------- flow ----------
function enterMatch(){rulesOpen=false;G.intro=true;undoStack=[];turretMode=false;G.stats=Object.assign({faces:0,jokers:0,kings:0,discards:0,disbands:0,turns:0},G.stats||{});sel=null;disbandMode=false;busy=false;armedFold=false;screen='match';save();render();window.scrollTo(0,0);}
function startMatch(i,skipRundown){
  if(i===-1&&!skipRundown){openRundown('road');return;}
  if(i===-2)G=newRoadTutorial();
  else if(i===-1)G=newTutorial('road');
  else return;
  G.stake=0;enterMatch();
}
function startClassic(i,skipRundown){
  if(i<0&&!skipRundown){openRundown('classic');return;}
  if(i<0){G=newTutorial('classic');G.stake=0;enterMatch();return;}
  const d=CLASSIC_DEALERS[i]; if(!d||!meta.classic.deck)return;
  G=newMatch(withPacks(meta.classic.deck.map(c=>({rank:c.rank,suit:c.suit})),packList()),addFaces(baseNumbers(),d.extra),i,baseRules());
  G.mode='classic';G.stake=0;
  enterMatch();
}
function describe(side,m){
  const who=side==='p'?'You':OPP().name.split(' ').slice(-1)[0];
  const whose=s=>s==='p'?'your':'their';
  if(m.t==='turret')return `${side==='p'?'Your turret':'A turret'} shot the top card off their caravan ${ROMAN[m.lane]}.`;
  if(m.t==='disband')return `${who} disbanded ${side==='p'?'your':'their'} caravan ${ROMAN[m.lane]}.`;
  const c=G[side].hand[m.ci];
  if(m.t==='discard')return `${who} discarded ${side==='p'?cardName(c):'a card'}.`;
  if(m.t==='num')return `${who} played ${cardName(c)} on caravan ${ROMAN[m.lane]}.`;
  const t=G[m.side].cv[m.lane][m.idx].card;
  return `${who} played ${cardName(c)} on ${whose(m.side)} ${G.rules.hideOpp&&m.side==='a'&&side==='a'?'caravan':cardName(t)}.`;
}
function bountyMet(id,lanes){
  const s=G.stats;
  if(id==='p26')return [0,1,2].some(l=>lanes[l]==='p'&&cvValue(G.p.cv[l])===26);
  if(id==='clean')return s.faces===0;
  if(id==='sweep')return lanes.every(x=>x==='p');
  if(id==='wild')return s.jokers>0;
  if(id==='calm')return s.discards===0&&s.disbands===0;
  if(id==='kings')return s.kings>=2;
  return false;
}
function finish(winner,reason){finishCore(winner,reason);try{if(winner==='p'){sfx('win');setTimeout(()=>sfx('clink'),520);buzz([20,60,20]);}else{sfx('lose');buzz(40);}}catch(e){}try{achOnFinish();}catch(e){}}
function finishCore(winner,reason){
  const o=OPP(), tutorial=G.opp<0, stake=G.stake||0;
  const ov={winner,reason,stake,win:0,bonus:0,tutorial,bounty:G.bounty||null,bountyWon:0,refund:0,scav:0,delta:0,mode:G.mode||'road'};
  if(G.mode==='campaign'&&G.rita){
    const cp=meta.classic.camp;cp.rita=cp.rita||{w:0,l:0};
    if(winner==='p'){cp.caps+=RITA.pay;cp.rita.w++;ov.delta=RITA.pay;}else{cp.rita.l++;ov.delta=0;}
    if(winner==='p'&&cp.tab){ov.tabPaid=payTab(cp,Math.ceil(RITA.pay/2));}
    cp.stocks={};
    G.over=ov;save();return;
  }
  if(G.mode==='campaign'&&G.cd){
    careerFinish(winner,ov,stake);
    G.over=ov;save();return;
  }
  if(G.mode==='campaign'){ // a match saved before the career update
    const cp=meta.classic.camp;winner==='p'?(cp.wins++,cp.caps+=stake*2):cp.losses++;ov.delta=winner==='p'?stake:-stake;
    G.over=ov; save(); return;
  }
  if(G.mode==='classic'){
    if(winner==='p')meta.classic.wins++;else meta.classic.losses++;
    if(G.opp>=0){const r=meta.classic.rec[G.opp]||{w:0,l:0};winner==='p'?r.w++:r.l++;meta.classic.rec[G.opp]=r;}
    if(tutorial)meta.tutorialDone=true;
    G.over=ov; save(); return;
  }
  if(G.run){
    winner==='p'?meta.wins++:meta.losses++;
    const r=meta.run,s=G.stats||{},costs=[];
    if(r.deck==='sarsaparilla'&&s.discards){const c=Math.min(meta.caps,s.discards);meta.caps-=c;if(c)costs.push(`−${c} for sticky discards`);}
    if(r.deck==='blood'&&s.jacks){const c=Math.min(meta.caps,s.jacks*2);meta.caps-=c;if(c)costs.push(`−${c} blood money for Jacks`);}
    r.kings=(r.kings||0)+(s.kings||0);
    runFinish(winner,ov);ov.extras=costs.concat(ov.extras||[]);
    G.over=ov;save();return;
  }
  if(tutorial&&G.mode==='road'){
    const k=G.opp===-1?'tutorialDone':'roadTutDone';meta[k]=true;ov.tutorial=true;ov.delta=0;
    G.over=ov;save();return;
  }
  G.over=ov;save();
}
function doMove(side,m){
  const d=describe(side,m);
  if(side==='p'&&G.stats){
    G.stats.turns=(G.stats.turns||0)+1;
    if(m.t==='discard')G.stats.discards++;
    else if(m.t==='disband')G.stats.disbands++;
    else if(m.t==='face'){const c=G.p.hand[m.ci];G.stats.faces++;if(c.rank==='JK')G.stats.jokers++;if(c.rank==='K')G.stats.kings++;if(c.rank==='J')G.stats.jacks=(G.stats.jacks||0)+1;}
    else if(m.t==='num'){const c=G.p.hand[m.ci];if(c.mod==='glass'&&c.si!=null)(G.glass=G.glass||[]).push(c.si);}
  }
  if(side==='p'&&m.t==='face')m._card=G.p.hand[m.ci];
  const pc=m.ci!=null?G[side].hand[m.ci]:null;
  const handIds=side==='p'?new Set(G.p.hand.map(c=>c.id)):null;
  const beforeA=G.a.cv.reduce((n,cv)=>n+cv.length,0);
  applyMove(G,side,m,false);
  try{achOnMove(side,m,beforeA);}catch(e){}
  G.log.unshift(d);
  G.fx={side:m.t==='face'?m.side:side,lane:m.t==='discard'?-1:m.lane,kind:m.t,rank:pc&&pc.rank,card:pc?{rank:pc.rank,suit:pc.suit,pack:pc.pack}:null,idx:m.idx,by:side,done:false};
  if(side==='p'){G.dealt=G.p.hand.filter(c=>!handIds.has(c.id)).map(c=>c.id);G.dealtDone=false;}
  sfx(m.t==='face'?(pc.rank==='J'?'jack':'face'):m.t==='discard'?'swish':(m.t==='disband'||m.t==='turret')?'jack':'snap',side);
  if(m.t==='turret'){G.turretUsed=true;G.fx={side:'a',lane:m.lane,kind:'turret',by:'p',done:false};}
  const w=winnerOf(G);
  if(w){
    const r=lanesResult(G),n=r.filter(x=>x==='p').length;
    finish(w,w==='p'?`You sold ${n} of 3 caravans against ${OPP().name}.`:`${OPP().name} sold ${3-n} of 3 caravans.`);
    render(); return;
  }
  // free actions keep the turn
  let keep=false;
  if(side==='p'&&m.t==='disband'&&G.rules.freeDisband.p)keep=true;
  else if(side==='p'&&G.extra&&m.t!=='disband'){G.extra=false;keep=true;}
  if(!keep&&side==='p'&&G.hugPending){G.hugPending=false;keep=true;G.log.unshift(`${OPP().name.split(' ').slice(-1)[0]} is still recovering from Greg’s hug. Your turn again.`);}
  if(!keep){G.turn=other(side);if(G.turn==='p'){G.chemTurn=false;if(side==='a'){setTimeout(()=>sfx('turn'),180);buzz(12);}}}
  if(!G[G.turn].hand.length){
    finish(other(G.turn),G.turn==='p'?'You ran out of cards.':`${OPP().name} ran out of cards.`);
    render(); return;
  }
  save();
  if(G.turn==='a'){busy=true;render();setTimeout(aiTurn,tutActive()?1100:({slow:1200,normal:750,fast:320})[meta.opt.speed]||750);}
  else render();
}
function aiTurn(){
  if(!G||G.over||screen!=='match'){busy=false;return;}
  let m=null;
  if(tutActive()){
    const step=tutSteps()[G.tut.step];
    if(step&&step.ai){m=resolveSpec(step.ai,'a');G.tut.step++;}
  }
  if(!m)m=chooseAIMove(G,'a',OPP().noise);
  busy=false;
  if(!m){finish('p',`${OPP().name} has no move left.`);render();return;}
  doMove('a',m);
}
const chemPouch=()=>G&&G.localChems?G.localChems:meta.chems;
let undoStack=[];
const undoable=()=>G&&G.mode==='classic'&&G.opp>=0&&!G.over;
function playerMove(m){if(undoable()){undoStack.push(JSON.stringify(G));if(undoStack.length>8)undoStack.shift();}doMove('p',m);}
let bustArm=null;
function bustCheck(m){
  if(!meta.opt.confirm||tutActive()||m.side==='a')return false;
  const g2=clone(G);applyMove(g2,'p',m,true);
  const l=m.lane,hi=G.rules.range.p[1],before=cvValue(G.p.cv[l]),after=cvValue(g2.p.cv[l]);
  if(after>hi&&before<=hi){const key=JSON.stringify(m);if(bustArm===key){bustArm=null;return false;}
    bustArm=key;G.log.unshift(`That would bust caravan ${ROMAN[l]} at ${after}. Tap it again to play anyway.`);render();return true;}
  bustArm=null;return false;
}
function useChem(id){
  const pouch=chemPouch();
  if(!pouch[id]||G.chemTurn||G.setupLeft.p>0||G.turn!=='p'||busy||G.over)return;
  const me=G.p;
  if(id==='spy'){if(G.peek)return;G.peek=true;G.log.unshift('You used a Spyglass.');}
  else if(id==='coffee'){if(G.extra)return;G.extra=true;G.log.unshift('You drank Black Coffee: two plays this turn.');}
  else if(id==='fresh'){const n=me.hand.length;me.deck.push(...me.hand);me.hand=[];shuffle(me.deck);while(me.hand.length<n&&me.deck.length)me.hand.push(me.deck.pop());G.log.unshift('You took a Fresh Deal.');}
  else if(id==='shoe'){if(!me.deck.length)return;for(let i=0;i<2&&me.deck.length;i++)me.hand.push(me.deck.pop());G.log.unshift('Horseshoe: you drew 2 cards.');}
  pouch[id]--; G.chemTurn=true; sel=null; sfx('clink'); if(!G.localChems)meta.st.chems++; checkState();
  if(tutActive()){const st=tutSteps()[G.tut.step];if(st.move&&st.move.t==='chem')G.tut.step++;}
  save(); render();
}

function unlock(id){
  if(!meta.ach)meta.ach={};
  if(meta.ach[id])return false;
  meta.ach[id]=Date.now();
  const a=ACH.find(x=>x.id===id),rw=backReward(id);
  if(a&&!achSilent)toast(rw?{...a,desc:`${a.desc} New pack: ${rw.name}.`}:a);
  return true;
}
function toast(a){toastQ.push(a);if(!toastOn)nextToast();}
function nextToast(){
  const a=toastQ.shift(); if(!a){toastOn=false;return;}
  toastOn=true;
  let el=document.getElementById('toast');
  if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');el.setAttribute('aria-live','polite');document.body.appendChild(el);}
  el.innerHTML=`<span class="medal" aria-hidden="true">★</span><span><small>${esc(a.label||'Achievement unlocked')}</small><b>${esc(a.name)}</b><em>${esc(a.desc)}</em></span>`;
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{el.classList.remove('show');setTimeout(nextToast,400);},3600);
}
function checkState(){
  const before=Object.keys(meta.ach||{}).length;
  if(meta.tutorialDone)unlock('tut_basics');
  if(meta.roadTutDone)unlock('tut_road');
  const cp=meta.classic.camp;
  if(cp&&((cp.cbeat||[]).length||cp.done||(cp.beaten||[]).length))unlock('camp_first');
  if(cp&&cp.done)unlock('camp_done');
  if(cp&&cp.career){
    if((cp.trophies||[]).some(t=>t.town==='goodsprings'))unlock('champ1');
    if((cp.trophies||[]).length>=3)unlock('trophy3');
    if((cp.cbeat||[]).some(x=>x.endsWith(':h')))unlock('highroller');
    if(Object.values(cp.rep||{}).some(n=>n>=10))unlock('legend');
    if(Object.values(cp.chal||{}).reduce((a,o)=>a+Object.keys(o).length,0)>=10)unlock('chal10');
    if((cp.tapes||[]).length>=6)unlock('tapes6');
    if((cp.plus||0)>=2)unlock('circuit2');
  }
  if(cp&&countsSize(cp.coll)>=120)unlock('collector');
  if(runLive()&&meta.caps>=100)unlock('hoard');
  if(typeof charUnlocked==='function'){if(charUnlocked('greg'))unlock('greg');if(charUnlocked('jeanita'))unlock('jeanita');}
  if(runLive()&&meta.perks.length>=5)unlock('loaded');
  if(meta.look&&(meta.look.back!=='sunburst'||meta.look.mat!=='leather'))unlock('style');
  if(meta.look&&meta.look.four)unlock('four');
  if(stv('hands')>=1)unlock('first_hand');
  if(stv('wins')>=1||meta.wins>0||meta.classic.wins>0)unlock('first_win');
  for(const a of ACH)if(a.prog){const [c,t]=a.prog();if(c>=t)unlock(a.id);}
  return Object.keys(meta.ach).length-before;
}
function achOnFinish(){
  const ov=G.over; if(!ov)return;
  const st=meta.st, won=ov.winner==='p', s=G.stats||{};
  st.hands++; if(won)st.wins++;
  unlock('first_hand');
  if(G.opp===-1)unlock('tut_basics');
  if(G.opp===-2)unlock('tut_road');
  if(won){
    unlock('first_win');
    const lanes=lanesResult(G);
    if(lanes.every(w=>w==='p'))unlock('sweep');
    if([0,1,2].some(l=>lanes[l]==='p'&&cvValue(G.p.cv[l])===26))unlock('exact26');
    if(!s.faces)unlock('clean');
    if(!s.discards&&!s.disbands)unlock('steady');
    if(s.disbands)unlock('burn');
    if(s.turns&&s.turns<=12)unlock('quick');
    if(s.turns>=40)unlock('long');
    if(G.mode==='classic'&&G.opp===3)unlock('classic_expert');
    if(G.mode==='campaign'&&(G.stake||0)>=500)unlock('all_in');
    if(G.mode==='road'&&G.opp>=0){
      if(G.run?(G.ruleIds||[]).includes('sand'):ROAD[G.opp].house.includes('sand'))unlock('blind');
      if(meta.caps-(ov.delta||0)<=2)unlock('comeback');
    }
    if(ov.bountyWon){st.bounties++;unlock('bounty1');}
  }
  checkState(); save();
}

  <li>Every run starts with a <b>Plain deck</b> and a few caps. Win tables to earn caps, plus <b>interest</b>: 1 cap for every 5 you hold, up to 5.</li>

function audio(){

function noiseBuf(a,dur){const b=a.createBuffer(1,Math.floor(a.sampleRate*dur),a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);return b;}
function tone(a,t,f,dur,type,vol,f2){const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02);}
function burst(a,t,dur,freq,q,vol,type){const s=a.createBufferSource();s.buffer=noiseBuf(a,dur);const f=a.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq;f.Q.value=q;const g=a.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(a.destination);s.start(t);}
function sfx(kind,by){
  const a=audio();if(!a)return;const t=a.currentTime+.005,soft=by==='a'?.55:1;
  try{
    if(kind==='snap')burst(a,t,.07,2400,1.2,.5*soft);
    else if(kind==='face'){burst(a,t,.07,2000,1.2,.45*soft);tone(a,t+.02,180,.12,'sine',.18*soft,120);}
    else if(kind==='jack'){burst(a,t,.18,900,.7,.35*soft,'highpass');tone(a,t,300,.18,'triangle',.08*soft,90);}
    else if(kind==='swish')burst(a,t,.14,1500,.6,.25*soft,'highpass');
    else if(kind==='clink'){tone(a,t,2300,.14,'sine',.12);tone(a,t+.06,3400,.12,'sine',.08);}
    else if(kind==='turn')tone(a,t,880,.16,'sine',.05);
    else if(kind==='win'){[523,659,784,1046].forEach((f,i)=>tone(a,t+i*.09,f,.28,'triangle',.12));}
    else if(kind==='lose'){tone(a,t,330,.5,'sine',.12,190);}
    else if(kind==='shuffle'){for(let i=0;i<9;i++)burst(a,t+i*.045,.05,2600+i*90,1.4,.18);}
    else if(kind==='stamp'){burst(a,t,.12,180,.8,.9,'lowpass');tone(a,t,90,.18,'sine',.25,50);}
    else if(kind==='tear'){burst(a,t,.32,3200,.5,.32,'highpass');burst(a,t+.08,.2,1800,.8,.2);}
    else if(kind==='blast'){burst(a,t,.6,220,.6,.8,'lowpass');tone(a,t,70,.5,'sine',.3,30);}
    else if(kind==='shot'){burst(a,t,.09,1200,.6,.9);burst(a,t+.02,.3,300,.5,.4,'lowpass');}
    else if(kind==='burn'){burst(a,t,.9,900,.3,.22);burst(a,t+.2,.7,2400,.4,.12,'highpass');}
    else if(kind==='bust'){tone(a,t,160,.25,'sawtooth',.06,90);}
  }catch(e){}
}

  if(c.includes('email-already-in-use'))return 'There’s already an account with that email. Try signing in instead.';
  if(c.includes('weak-password'))return 'Use a password with at least 6 characters.';
  if(c.includes('invalid-email'))return 'That doesn’t look like an email address.';
  if(c.includes('unauthorized-domain'))return 'This website isn’t on the Firebase authorized domains list yet.';
  if(c.includes('operation-not-allowed'))return 'This sign-in method isn’t switched on in Firebase yet.';
  if(c.includes('network'))return 'No connection. Try again when you’re online.';

// ---------- art: procedural textures, card back art, table props, dust ----------
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')];}
function rngSeed(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=(s*16807)%2147483647)/2147483647;}
function addNoise(x,W,H,r,amt){const d=x.getImageData(0,0,W,H);for(let i=0;i<d.data.length;i+=4){const n=(r()-.5)*amt;d.data[i]+=n;d.data[i+1]+=n;d.data[i+2]+=n;}x.putImageData(d,0,0);}
function rrect(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}

function texGrain(){
  const N=200,[c,x]=mkCanvas(N,N),r=rngSeed(11),d=x.createImageData(N,N);
  for(let i=0;i<d.data.length;i+=4){const v=r()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=r()<.5?16:0;}
  x.putImageData(d,0,0);return c.toDataURL();
}
function texPaper(){
  const N=160,[c,x]=mkCanvas(N,N),r=rngSeed(5);
  for(let i=0;i<1100;i++){x.fillStyle=r()<.55?`rgba(90,60,30,${r()*.07})`:`rgba(255,250,235,${r()*.08})`;x.fillRect(r()*N,r()*N,r()*2+.4,r()*2+.4);}
  x.lineWidth=.6;
  for(let i=0;i<46;i++){x.strokeStyle=`rgba(110,80,40,${.03+r()*.04})`;x.beginPath();const sx=r()*N,sy=r()*N;x.moveTo(sx,sy);x.quadraticCurveTo(sx+r()*20-10,sy+r()*20-10,sx+r()*30-15,sy+r()*30-15);x.stroke();}
  return c.toDataURL();
}
function texWood(base,dark,light,seed){
  const W=512,H=256,[c,x]=mkCanvas(W,H),r=rngSeed(seed),PH=64;
  x.fillStyle=base;x.fillRect(0,0,W,H);
  for(let p=0;p<H/PH;p++){
    const y0=p*PH,tone=(r()-.5)*.22;
    x.fillStyle=tone>0?`rgba(255,215,160,${tone*.6})`:`rgba(0,0,0,${-tone})`;x.fillRect(0,y0,W,PH);
    for(let i=0;i<30;i++){
      const yy=y0+r()*PH,amp=.8+r()*3.2,k=1+Math.floor(r()*4),fr=k*2*Math.PI/W,ph=r()*6;
      x.strokeStyle=r()<.62?dark:light;x.globalAlpha=.08+r()*.24;x.lineWidth=.5+r()*1.8;
      x.beginPath();for(let xx=0;xx<=W;xx+=8){const yv=yy+Math.sin(xx*fr+ph)*amp;xx?x.lineTo(xx,yv):x.moveTo(xx,yv);}x.stroke();
    }
    if(r()<.75){const kx=60+r()*(W-120),ky=y0+PH*(.35+r()*.3);x.strokeStyle=dark;x.lineWidth=1;
      for(let k=0;k<7;k++){x.globalAlpha=.32-k*.03;x.beginPath();x.ellipse(kx,ky,5+k*6,1.8+k*1.5,0,0,Math.PI*2);x.stroke();}
      x.globalAlpha=.5;x.fillStyle=dark;x.beginPath();x.ellipse(kx,ky,4,1.8,0,0,7);x.fill();}
    x.globalAlpha=1;
    x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,y0+PH-2,W,2);
    x.fillStyle='rgba(255,230,190,.07)';x.fillRect(0,y0,W,1);
    for(const nx of [14,W/2+7,W-14]){x.fillStyle='rgba(20,14,8,.85)';x.beginPath();x.arc(nx,y0+PH/2,2.3,0,7);x.fill();x.fillStyle='rgba(255,230,190,.25)';x.beginPath();x.arc(nx-.7,y0+PH/2-.7,.8,0,7);x.fill();}
  }
  for(let i=0;i<110;i++){x.strokeStyle=`rgba(255,235,200,${r()*.07})`;x.lineWidth=.5;x.beginPath();const sx=r()*W,sy=r()*H;x.moveTo(sx,sy);x.lineTo(sx+r()*44-22,sy+r()*6-3);x.stroke();}

  for(let i=0;i<3200;i++){const px=r()*W,py=r()*H,rad=.8+r()*2.4,dk=r()<.55;

function texDust(){
  const N=320,[c,x]=mkCanvas(N,N),r=rngSeed(29);

  return c.toDataURL();

// --- dust motes drifting across the screen ---
function startDust(){
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const c=document.getElementById('dustfx');if(!c||reduce)return;
  const x=c.getContext('2d');let W=0,H=0,dpr=1;
  const P=Array.from({length:46},()=>({x:Math.random(),y:Math.random(),s:Math.random()*1.6+.4,a:Math.random()*.25+.06,vx:Math.random()*.00025+.00008,vy:(Math.random()-.6)*.00012,w:Math.random()*6}));
  const size=()=>{dpr=window.devicePixelRatio||1;W=window.innerWidth;H=window.innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);};
  size();window.addEventListener('resize',size);
  let t=0;const tick=()=>{if(!document.hidden){t+=1;x.clearRect(0,0,W,H);
    if(typeof meta!=='undefined'&&meta&&meta.opt&&meta.opt.dust===false){requestAnimationFrame(tick);return;}
    for(const p of P){p.x+=p.vx;p.y+=p.vy+Math.sin((t/90)+p.w)*.00006;if(p.x>1.02)p.x=-.02;if(p.y<-.02)p.y=1.02;if(p.y>1.02)p.y=-.02;
      x.fillStyle=`rgba(232,205,160,${p.a})`;x.beginPath();x.arc(p.x*W,p.y*H,p.s,0,7);x.fill();}}
    requestAnimationFrame(tick);};
  requestAnimationFrame(tick);
}

// Unlockable card back art: cardbacks/<id>.png|jpg|jpeg|webp, with a placeholder until it's uploaded.
function backPlaceholder(name){
  const W=240,H=336,[c,x]=mkCanvas(W,H);
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#3a2618');g.addColorStop(1,'#1b110b');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.strokeStyle='#c9a25a';x.lineWidth=3;rrect(x,12,12,W-24,H-24,10);x.stroke();x.lineWidth=1;rrect(x,20,20,W-40,H-40,7);x.stroke();
  x.fillStyle='#e6c171';x.textAlign='center';x.font='22px Limelight, Georgia, serif';
  const words=name.toUpperCase().split(' ');let line='',lines=[];for(const w of words){if((line+' '+w).trim().length>11){lines.push(line.trim());line=w;}else line+=' '+w;}lines.push(line.trim());
  lines.forEach((l,i)=>x.fillText(l,W/2,H/2-((lines.length-1)*14)+i*28));
  return c.toDataURL();
}
function loadBackArt(){
  const css=[],exts=['png','jpg','jpeg','webp','PNG','JPG','JPEG'];
  for(const b of LOOKS.back.filter(b=>b.art)){
    document.documentElement.style.setProperty('--back-'+b.id,`url(${backPlaceholder(b.name)})`);
    css.push(`[data-back="${b.id}"]{--back-bg:var(--back-${b.id}) center/cover no-repeat, #1b110b;--back-border:#00000099}`);
    const tryExt=n=>{if(n>=exts.length)return;const im=new Image();im.onload=()=>document.documentElement.style.setProperty('--back-'+b.id,`url(${im.src})`);im.onerror=()=>tryExt(n+1);im.src=`cardbacks/${b.id}.${exts[n]}`;};
    tryExt(0);
  }
  const st=document.createElement('style');st.textContent=css.join('\n');document.head.appendChild(st);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{for(const b of LOOKS.back.filter(b=>b.art)){const cur=getComputedStyle(document.documentElement).getPropertyValue('--back-'+b.id);if(cur.includes('data:'))document.documentElement.style.setProperty('--back-'+b.id,`url(${backPlaceholder(b.name)})`);}});
}
function initArt(){
  try{loadBackArt();}catch(e){}
  const root=document.documentElement.style;
  const set=(k,url)=>root.setProperty(k,`url(${url})`);
  try{
    set('--tex-grain',texGrain());set('--tex-paper',texPaper());set('--tex-dust',texDust());
    set('--tex-wood',texWood('#4a2e1b','#2a170b','#7a5233',3));
    set('--tex-wood-light',texWood('#7a5230','#3e2412','#a87a4c',9));
    set('--tex-leather',texLeather('#3b2416',4));
    set('--tex-leather-mat',texLeather('#4a1f17',8));
    const drawBacks=()=>{for(const id of BACK_IDS)set('--back-'+id,backArt(id));};
    drawBacks();
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{drawBacks();});
  }catch(e){}
  startDust();
}

// Custom art: drop PNG, JPG or WebP images named after each character into a "portraits" folder next to index.html.
const PORTRAIT_FILE={};
function loadPortraitFiles(){
  const exts=['png','jpg','jpeg','webp','PNG','JPG','JPEG'];
  for(const id of Object.keys(PORTRAIT_FN)){
    const tryExt=n=>{if(n>=exts.length)return;const im=new Image();
      im.onload=()=>{PORTRAIT_FILE[id]=im.src;if(typeof render==='function'&&meta)render();};
      im.onerror=()=>tryExt(n+1);

}
function portrait(id,locked){
  if(!locked&&PORTRAIT_FILE[id])return PORTRAIT_FILE[id];
  const key=id+(locked?'-L':'');if(PORTRAIT_CACHE[key])return PORTRAIT_CACHE[key];
  const S=2,W=240,H=300,[c,x]=mkCanvas(W*S,H*S);x.scale(S,S);
  // aged cream paper, a colored burst and halftone dots: mid-century print look
  x.fillStyle='#efe2c4';x.fillRect(0,0,W,H);
  x.save();x.translate(120,130);for(let i=0;i<20;i++){x.rotate(Math.PI/10);x.fillStyle=i%2?PORTRAIT_BG[id]:'rgba(0,0,0,0)';x.beginPath();x.moveTo(0,0);x.lineTo(-30,-260);x.lineTo(30,-260);x.closePath();x.fill();}x.restore();
  x.fillStyle='rgba(60,40,20,.16)';for(let yy=0;yy<H;yy+=6)for(let xx=(yy/6)%2*3;xx<W;xx+=6){const d=Math.hypot(xx-120,yy-130)/200;x.beginPath();x.arc(xx,yy,Math.max(0,.4+d*1.6),0,7);x.fill();}

  const [cc,cx2]=mkCanvas(W*S,H*S);cx2.scale(S,S);PORTRAIT_FN[id](cx2);
  const [sc,sx]=mkCanvas(W*S,H*S);sx.drawImage(cc,0,0);sx.globalCompositeOperation='source-in';sx.fillStyle='#1b120c';sx.fillRect(0,0,W*S,H*S);
  x.setTransform(1,0,0,1,0,0);
  for(let k=0;k<16;k++){const a=k/16*Math.PI*2;x.drawImage(sc,Math.cos(a)*7,Math.sin(a)*7);}
  if(locked){x.drawImage(sc,0,0);}else x.drawImage(cc,0,0);
  x.setTransform(S,0,0,S,0,0);
  if(locked){x.fillStyle='#efe2c4';x.font='64px Limelight, Georgia, serif';x.textAlign='center';x.fillText('?',120,150);}
  // paper wear
  const r=rngSeed(id.length*31);x.strokeStyle='rgba(255,250,235,.35)';x.lineWidth=.6;for(let i=0;i<40;i++){x.beginPath();const px=r()*W,py=r()*H;x.moveTo(px,py);x.lineTo(px+(r()-.5)*30,py+(r()-.5)*8);x.stroke();}

  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let i=0;i<220;i++){const sx=rnd()*w,sy=rnd()*h*.62,r=rnd()*1.2+.2;x.globalAlpha=.25+rnd()*.7;x.fillStyle='#fff6e6';x.fillRect(sx,sy,r,r);}

  for(let bx=cx-w*.12;bx<cx+w*.12;bx+=6+rnd()*8){const bh=6+rnd()*rnd()*46;x.fillRect(bx,hy-bh,5+rnd()*6,bh);}
  x.fillRect(cx-1.5,hy-h*.11,3,h*.11);x.beginPath();x.ellipse(cx,hy-h*.11,9,4,0,0,Math.PI*2);x.fill();
  x.fillStyle='#ffb46a';
  for(let i=0;i<60;i++){const wx=cx-w*.11+rnd()*w*.22,wy=hy-rnd()*30;if(rnd()<.5)x.fillRect(wx,wy,1.2,1.2);}
  // mesas
  x.fillStyle='#0f0a09';x.beginPath();x.moveTo(0,h);x.lineTo(0,hy-h*.05);

  x.lineTo(w,h);x.closePath();x.fill();
}

function rollPerkOffer(n){

}

  const ti=tierIdx(r.tier);
  const tokenFor=[['kit','marked'],['charm'],['second']][ti];
  for(const tk of tokenFor)if(!meta.tokens.includes(tk)){meta.tokens.push(tk);unl.push(`${TOKENS[tk].name} token`);}
  if(ti+1<TIERS.length&&meta.tiersUnlocked<ti+2){meta.tiersUnlocked=ti+2;unl.push(TIERS[ti+1].name);}

}

  campfire:{title:'A Quiet Campfire',text:'Somebody left a fire burning by the road, with a coffee pot still warm. A good place to catch your breath, or to swap tall tales with a passing trader.',
    choices:[{label:'Rest a while (restore 1 Grit, up to 2)',act:()=>{const r=run();if((r.grit||0)<2){r.grit=(r.grit||0)+1;return `You feel steadier. Grit: ${r.grit}.`;}return 'You’re as steady as you get. The coffee was good, though.';}},{label:'Swap stories (+4 caps)',act:()=>{meta.caps+=4;return 'The trader liked your story enough to pay for it. +4 caps.';}}]},
  medic:{title:'A Wandering Medic',text:'A medic offers chems from her bag at a fair price.',
    choices:[{label:'Buy a random chem (2 caps)',cost:2,act:()=>{if(chemTotal()<chemMax()){const id=pick(Object.keys(CHEMS));meta.chems[id]++;return `You got a ${CHEMS[id].name}.`;}return 'Your pouch is full. She keeps the caps anyway. Rude.';}},{label:'Decline',act:()=>'She nods and moves along.'}]},

function eventChoose(i){
  const r=run(),ev=EVENTS[r.event];if(!ev)return;const ch=ev.choices[i];if(!ch)return;
  if(ch.cost&&meta.caps<ch.cost)return;
  if(ch.cost)meta.caps-=ch.cost;
  const res=ch.act();if(res!=null)r.eventResult=res;save();
}
function eventDone(){const r=run();r.event=null;r.eventResult=null;r.phase='shop';openShop();save();}

function deckTex(id){
  const W=240,H=336,[c,x]=mkCanvas(W,H),r=rngSeed(id.length*131+7);
  const splat=(sx,sy,R,col)=>{x.fillStyle=col;x.beginPath();x.arc(sx,sy,R,0,7);x.fill();for(let i=0;i<12;i++){const a=r()*7,d=R*(.7+r()*1.2);x.beginPath();x.arc(sx+Math.cos(a)*d,sy+Math.sin(a)*d,R*(.08+r()*.22),0,7);x.fill();}};
  if(id==='sarsaparilla'){
    for(let i=0;i<3;i++){const cx=40+r()*160,cy=60+r()*220,R=26+r()*30;x.strokeStyle=`rgba(110,60,20,${.35+r()*.2})`;x.lineWidth=3+r()*4;x.beginPath();x.arc(cx,cy,R,0,7);x.stroke();
      x.strokeStyle='rgba(110,60,20,.15)';x.lineWidth=10;x.beginPath();x.arc(cx,cy,R-4,r()*3,r()*3+2);x.stroke();}
    for(let i=0;i<3;i++){const dx=20+r()*200,len=30+r()*80;x.strokeStyle='rgba(120,65,20,.45)';x.lineWidth=3+r()*3;x.lineCap='round';x.beginPath();x.moveTo(dx,0);x.lineTo(dx+r()*4,len);x.stroke();}
    const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(140,80,30,.18)');g.addColorStop(1,'rgba(140,80,30,.05)');x.fillStyle=g;x.fillRect(0,0,W,H);
  }else if(id==='blood'){
    splat(60+r()*120,80+r()*80,14+r()*8,'rgba(120,10,8,.75)');splat(40+r()*160,220+r()*80,8+r()*6,'rgba(120,10,8,.7)');
    for(let i=0;i<40;i++){x.fillStyle=`rgba(110,8,6,${.3+r()*.5})`;x.beginPath();x.arc(r()*W,r()*H,r()*2.2,0,7);x.fill();}
    x.strokeStyle='rgba(110,8,6,.7)';x.lineWidth=3;x.lineCap='round';const dx=50+r()*140;x.beginPath();x.moveTo(dx,40+r()*40);x.lineTo(dx+2,160+r()*60);x.stroke();
  }else if(id==='scorched'){
    const g=x.createRadialGradient(W/2,H/2,Math.min(W,H)*.25,W/2,H/2,Math.max(W,H)*.62);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.75,'rgba(60,25,8,.45)');g.addColorStop(1,'rgba(10,5,2,.95)');x.fillStyle=g;x.fillRect(0,0,W,H);
    for(let i=0;i<60;i++){const e=r()*4|0,t2=r();const px=e<2?t2*W:(e===2?r()*20:W-r()*20),py=e>=2?t2*H:(e===0?r()*20:H-r()*20);x.fillStyle=`rgba(${r()<.3?'255,140,40':'20,10,5'},${.4+r()*.5})`;x.beginPath();x.arc(px,py,1+r()*4,0,7);x.fill();}
  }else if(id==='irradiated'){
    const g=x.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.65);g.addColorStop(0,'rgba(120,255,90,0)');g.addColorStop(1,'rgba(120,255,90,.5)');x.fillStyle=g;x.fillRect(0,0,W,H);
    for(let i=0;i<70;i++){x.fillStyle=`rgba(150,255,110,${.25+r()*.6})`;x.beginPath();x.arc(r()*W,r()*H,r()*2.4,0,7);x.fill();}
    for(let i=0;i<4;i++){const px=r()*W,py=r()*H,rg=x.createRadialGradient(px,py,0,px,py,30);rg.addColorStop(0,'rgba(140,255,100,.35)');rg.addColorStop(1,'rgba(140,255,100,0)');x.fillStyle=rg;x.fillRect(0,0,W,H);}
  }else if(id==='rust'){
    for(let i=0;i<16;i++){const px=r()*W,py=r()*H,R=12+r()*40,rg=x.createRadialGradient(px,py,0,px,py,R);rg.addColorStop(0,`rgba(${150+r()*40},${60+r()*20},18,${.45+r()*.3})`);rg.addColorStop(1,'rgba(140,60,18,0)');x.fillStyle=rg;x.fillRect(0,0,W,H);}
    for(let i=0;i<500;i++){x.fillStyle=`rgba(${r()<.5?'150,60,20':'80,30,10'},${r()*.4})`;x.fillRect(r()*W,r()*H,1.5,1.5);}
  }else if(id==='bullet'){
    const hole=(hx,hy)=>{const bg=x.createRadialGradient(hx,hy,4,hx,hy,22);bg.addColorStop(0,'rgba(30,15,5,.75)');bg.addColorStop(1,'rgba(30,15,5,0)');x.fillStyle=bg;x.beginPath();x.arc(hx,hy,22,0,7);x.fill();
      x.fillStyle='rgba(240,225,190,.9)';x.beginPath();for(let i=0;i<12;i++){const a=i/12*Math.PI*2,rad=7+r()*5;x.lineTo(hx+Math.cos(a)*rad,hy+Math.sin(a)*rad);}x.closePath();x.fill();
      x.fillStyle='#0c0907';x.beginPath();x.arc(hx,hy,5.5,0,7);x.fill();};
    hole(60+r()*40,80+r()*60);hole(140+r()*60,200+r()*80);
    x.strokeStyle='rgba(30,20,10,.25)';x.lineWidth=1;for(let i=0;i<10;i++){x.beginPath();const sx=r()*W,sy=r()*H;x.moveTo(sx,sy);x.lineTo(sx+(r()-.5)*40,sy+(r()-.5)*40);x.stroke();}
  }else if(id==='gold'){

    x.strokeStyle='rgba(212,160,60,.9)';x.lineWidth=7;rrect(x,3,3,W-6,H-6,12);x.stroke();
    for(let i=0;i<18;i++){const px=r()*W,py=r()*H;x.fillStyle='rgba(255,250,220,.9)';x.beginPath();for(let k=0;k<8;k++){const a=k*Math.PI/4,rad=k%2?1:4;x.lineTo(px+Math.cos(a)*rad,py+Math.sin(a)*rad);}x.closePath();x.fill();}
  }
  return c.toDataURL();
}
function loadDeckTextures(){

function runShopBuy(key){
  const r=run(),of=r.offers;if(of.sold[key])return;
  const pay=n=>{if(meta.caps<n)return false;meta.caps-=n;return true;};
  if(key.startsWith('perk')){const id=of.perks[+key.slice(4)];if(meta.perks.length>=perkSlots())return;if(!pay(perkRunPrice(id)))return;meta.perks.push(id);meta.equipped=meta.perks;of.sold[key]=1;if(meta.perks.length>=5)unlock('loaded');}
  else if(key.startsWith('bundle')){const b=of.bundles[+key.slice(6)];if(!pay(disc(BUNDLES[b.id].price)))return;of.sold[key]=1;openBundle(b,false);}
  else if(key==='burn'){if(r.burnUsed||!burnRoom())return;if(!pay(disc(2)))return;r.burnUsed=true;of.sold[key]=1;openBurn(2,'Burn pile','Pick up to 2 cards to burn. They’re gone for the rest of the run.');}
  else if(key.startsWith('crate-')){const k=key.slice(6);if(!pay(disc(CRATES[k].price)))return;openCrate(k);}
  else if(key.startsWith('card')){const c=of.cards[+key.slice(4)];if(!pay(runCardPrice(c)))return;meta.deck.push({...c});of.sold[key]=1;}
  else if(key.startsWith('chem')){const id=of.chems[+key.slice(4)];if(chemTotal()>=chemMax())return;if(!pay(chemRunPrice(id)))return;meta.chems[id]++;}
  else if(key==='upgrade'){if(r.freeUpgrade){r.freeUpgrade=0;}else if(!pay(disc(5)))return;r.workbench={mod:of.upgrade};of.sold[key]=1;}
  else if(key==='voucher'){if(!pay(disc(9)))return;r.vouchers.push(of.voucher);r.voucherStop=r.stop;of.sold[key]=1;}
  save();
}

function handleRunClick(d){
  const r=run();
  if('rundeck' in d){meta.newRun.deck=d.rundeck;render();return true;}
  if('runtier' in d){meta.newRun.tier=d.runtier;render();return true;}
  if('runtoken' in d){meta.newRun.token=d.runtoken||null;render();return true;}
  if('runstart' in d){if(!meta.char){screen='pickchar';render();return true;}startRun();runPre=false;runArmed=false;render();window.scrollTo(0,0);return true;}
  if('runstoryok' in d){r.story.shift();save();render();return true;}
  if('runbeyond' in d){if(r&&r.result==='won'&&!r.endless){r.endless=true;r.phase='event';r.result=null;r.stop=RUN_STOPS.length;r.table=0;ensureStop(r.stop);r.event=pick(Object.keys(EVENTS));r.eventResult=null;r.story=[{title:'Beyond the Strip',text:BEYOND_INTRO}];save();}render();window.scrollTo(0,0);return true;}
  if('runnew' in d){meta.run=null;save();render();window.scrollTo(0,0);return true;}
  if('runabandon' in d){if(runArmed){runArmed=false;runLost();r.result='lost';save();}else runArmed=true;render();return true;}
  if('runplay' in d){runPre=true;render();return true;}
  if('runcancel' in d){runPre=false;render();return true;}
  if('runconfirm' in d){runPre=false;if(r.table===2){render();wantedPoster(()=>startRunTable());}else startRunTable();return true;}
  if('runskip' in d){skipTable();render();return true;}
  if('runcontinue' in d){G=null;screen='road';render();window.scrollTo(0,0);return true;}
  if('eventpick' in d){eventChoose(+d.eventpick);render();return true;}
  if('eventdone' in d){eventDone();render();return true;}
  if('runnext' in d){r.phase='table';r.offers=null;r.halfShop=false;armedSell=null;runShopTab='shop';save();render();window.scrollTo(0,0);return true;}
  if('rtab' in d){runShopTab=d.rtab;armedSell=null;render();return true;}
  if('rbuy' in d){runShopBuy(d.rbuy);render();return true;}
  if('rreroll' in d){if(r.sponsor){r.sponsor=0;}else if(r.freeRerolls){r.freeRerolls--;}else{const c=rerollCost();if(meta.caps<c)return true;meta.caps-=c;r.rerolls=(r.rerolls||0)+1;}rerollShop();save();render();return true;}
  if('cratepick' in d){takeCrate(+d.cratepick);render();return true;}
  if('crateskip' in d){r.crate=null;save();render();return true;}
  if('pickc' in d){const pk=r.picker;if(pk){const i=+d.pickc,k=pk.sel.indexOf(i);if(k>=0)pk.sel.splice(k,1);else if(pk.sel.length<(pk.kind==='burn'?Math.min(pk.keep,burnRoom()):pk.keep))pk.sel.push(i);}render();return true;}
  if('pickdone' in d){const pk=r.picker;if(pk&&pk.kind==='burn'){const els=[...document.querySelectorAll('#app .pickcard.on')];burnCards(els,()=>{pickerDone();render();});}else{pickerDone();render();}return true;}
  if('pickskip' in d){if(r.picker&&r.picker.kind==='burn'&&r.phase==='event')r.eventResult='You leave the fire burning and move on.';r.picker=null;save();render();return true;}
  if('wbpick' in d){const c=meta.deck[+d.wbpick];if(c&&r.workbench){c.mod=r.workbench.mod;r.workbench=null;if(modCount()>=5)unlock('tinker');save();}render();return true;}
  if('wbcancel' in d){r.workbench=null;save();render();return true;}
  if('rsell' in d){const i=+d.rsell;if(armedSell===i){if(meta.deck.length>MIN_DECK){meta.deck.splice(i,1);meta.caps+=1;save();}armedSell=null;}else armedSell=i;render();return true;}
  if('rsellperk' in d){const id=d.rsellperk,k='p:'+id;if(armedSell===k){meta.perks=meta.perks.filter(p=>p!==id);meta.equipped=meta.perks;meta.caps+=perkSellPrice(id);armedSell=null;save();}else armedSell=k;render();return true;}
  return false;
}

const motionOn=()=>!!(meta&&meta.opt&&meta.opt.motion!==false)&&!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const mDur=()=>({slow:520,normal:360,fast:210})[meta&&meta.opt.speed]||360;
const hashStr=s=>{let h=2166136261;for(const ch of String(s)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;};
const tiltOf=id=>{const h=hashStr(id);return `${((h%100)/100*4.4-2.2).toFixed(2)}deg`;};
const nudgeOf=id=>{const h=hashStr(id+'x');return `${((h%100)/100*6-3).toFixed(1)}px`;};

function fxLayer(){let l=document.getElementById('fxlayer');if(!l){l=document.createElement('div');l.id='fxlayer';document.body.appendChild(l);}return l;}
function ghost(html,r,cls){
  const g=document.createElement('div');g.className='fxghost '+(cls||'');g.innerHTML=html;

const done=(a,el)=>{a.onfinish=()=>el.remove();a.oncancel=()=>el.remove();};
const ctr=r=>({x:r.left+r.width/2,y:r.top+r.height/2});

function snapMatch(){

  document.querySelectorAll('#app [data-cid]').forEach(el=>{const c=el.querySelector('.card')||el;s.cards[el.dataset.cid]={r:el.getBoundingClientRect(),zone:el.dataset.zone,html:c.outerHTML,side:el.dataset.side,lane:el.dataset.lane};});
  document.querySelectorAll('#app .deckpile').forEach(el=>{s.piles[el.classList.contains('mine')?'p':'a']=el.getBoundingClientRect();});

}
function countUp(el,from,to,dur){

  const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=Math.round(from+(to-from)*e);if(k<1)requestAnimationFrame(step);};
  requestAnimationFrame(step);

function flipCover(el,pack,d,delay){

  const cov=document.createElement('div');cov.className='flipcover';if(pack)cov.dataset.back=pack;card.appendChild(cov);
  card.animate([{transform:'scaleX(1)'},{transform:'scaleX(.04)',offset:.5},{transform:'scaleX(1)'}],{duration:d,delay,easing:'ease-in-out'});
  const a=cov.animate([{opacity:1},{opacity:1,offset:.5},{opacity:0,offset:.501},{opacity:0}],{duration:d,delay,fill:'both'});done(a,cov);
}
function animateMatch(prev,fx){
  if(!motionOn()||!G)return;
  const d=mDur(),intro=G.intro;G.intro=false;
  const now={};document.querySelectorAll('#app [data-cid]').forEach(el=>now[el.dataset.cid]=el);
  const pileP=document.querySelector('#app .deckpile.mine'),pileA=document.querySelector('#app .deckpile.small');
  // riffle the decks at the start of a hand
  if(intro){[pileP,pileA].forEach(p=>p&&p.classList.add('riffle'));sfx('shuffle');setTimeout(()=>[pileP,pileA].forEach(p=>p&&p.classList.remove('riffle')),700);}
  let k=0;
  for(const [cid,el] of Object.entries(now)){
    const zone=el.dataset.zone,r=el.getBoundingClientRect(),p=prev&&prev.cards[cid];
    let from=null,flip=false,pack=null;
    if(p){
      const dx0=p.r.left-r.left,dy0=p.r.top-r.top;
      if(Math.abs(dx0)<3&&Math.abs(dy0)<3)continue;
      if(zone==='hand'&&p.zone==='hand'&&Math.abs(dx0)<4&&Math.abs(dy0)<16)continue;
      from=p.r;flip=p.zone==='fan'&&zone==='cv';
      if(flip){const m=/data-back="([^"]+)"/.exec(p.html);pack=m?m[1]:null;}
    }else{
      if(!prev&&!intro)continue;
      const src=zone==='fan'?pileA:zone==='hand'?pileP:null;if(!src)continue;
      from=src.getBoundingClientRect();flip=zone==='hand';
    }
    const dx=ctr(from).x-ctr(r).x,dy=ctr(from).y-ctr(r).y,sc=Math.max(.5,Math.min(1.6,(from.width||r.width)/r.width));
    const delay=p?0:(intro?520:120)+(k++)*(intro?75:90);
    const rot=(hashStr(cid)%2?1:-1)*(6+hashStr(cid)%8);
    const base=getComputedStyle(el).transform,bt=base&&base!=='none'?base:'';
    el.animate([{transform:`translate(${dx}px,${dy}px) scale(${sc}) rotate(${rot}deg) ${bt}`},{transform:bt||'none'}],{duration:d*1.15,delay,easing:'cubic-bezier(.2,.8,.25,1)',fill:'backwards'});
    if(flip)flipCover(el,pack||(zone==='hand'?(G.p.hand.find(c=>c.id===cid)||{}).pack:null),d*1.15,delay);
    if(!p&&zone==='hand'&&!intro)setTimeout(()=>sfx('swish'),delay);
  }
  if(!prev)return;
  // cards that left the table
  const gone=Object.entries(prev.cards).filter(([cid])=>!now[cid]);
  const kind=fx&&fx.kind, rank=fx&&fx.rank;
  // a face card played: fly the card from hand/fan to its target, then dissolve into the chip
  const faceSrc=gone.find(([,p])=>(p.zone==='hand'||p.zone==='fan')&&fx&&kind==='face');
  let hitAt=null;
  if(fx&&kind==='face'){
    const tgt=document.querySelector(`#app .entry[data-side="${fx.side}"][data-lane="${fx.lane}"][data-idx="${fx.idx}"]`);
    const victim=gone.find(([,p])=>p.zone==='cv'&&p.side===fx.side&&+p.lane===fx.lane);
    hitAt=tgt?tgt.getBoundingClientRect():victim?victim[1].r:null;
  }
  if(faceSrc&&hitAt){
    const [,p]=faceSrc;let html=p.html;
    if(p.zone==='fan'&&fx.card)html=cardHTML(fx.card);
    const g=ghost(html,p.r,'travel');
    const dx=ctr(hitAt).x-ctr(p.r).x,dy=ctr(hitAt).y-ctr(p.r).y;
    const a=g.animate([{transform:'none',opacity:1},{transform:`translate(${dx}px,${dy}px) rotate(${rank==='JK'?-20:12}deg) scale(1.08)`,opacity:1,offset:.75},{transform:`translate(${dx}px,${dy}px) scale(.5)`,opacity:0}],{duration:d*1.3,easing:'cubic-bezier(.3,.7,.3,1)'});done(a,g);
  }
  const hitDelay=faceSrc?d*.95:0;
  const victims=gone.filter(([,p])=>p.zone==='cv');
  if(kind==='face'&&rank==='JK'&&hitAt){
    setTimeout(()=>{const c=ctr(hitAt),w=document.createElement('div');w.className='shock';Object.assign(w.style,{left:c.x+'px',top:c.y+'px'});fxLayer().appendChild(w);
      const a=w.animate([{transform:'translate(-50%,-50%) scale(.2)',opacity:.95},{transform:'translate(-50%,-50%) scale(9)',opacity:0}],{duration:d*2,easing:'cubic-bezier(.1,.7,.3,1)'});done(a,w);sfx('blast');buzz([30,40,30]);
      document.querySelector('#app .table')&&document.querySelector('#app .table').animate([{transform:'none'},{transform:'translate(3px,-2px)'},{transform:'translate(-3px,2px)'},{transform:'none'}],{duration:260});},hitDelay);
  }
  victims.forEach(([cid,p],i)=>{
    const delay=hitDelay+(kind==='disband'?i*60:0);
    if(kind==='face'&&rank==='J'){
      setTimeout(()=>sfx('tear'),delay);
      for(const half of [-1,1]){
        const g=ghost(p.html,p.r,'torn '+(half<0?'tl':'tr'));
        const a=g.animate([{transform:'none',opacity:1},{transform:`translate(${half*34}px,${40+Math.random()*30}px) rotate(${half*(18+Math.random()*16)}deg)`,opacity:0}],{duration:d*2,delay,easing:'cubic-bezier(.3,.1,.6,1)',fill:'backwards'});done(a,g);
      }
    }else if(kind==='face'&&rank==='JK'&&hitAt){
      const c=ctr(hitAt),pc=ctr(p.r),ang=Math.atan2(pc.y-c.y,pc.x-c.x)||Math.random()*6,dist=160+Math.random()*80;
      const g=ghost(p.html,p.r,'blasted');
      const a=g.animate([{transform:'none',opacity:1},{transform:`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist}px) rotate(${(Math.random()-.5)*720}deg) scale(.7)`,opacity:0}],{duration:d*2.2,delay,easing:'cubic-bezier(.15,.7,.4,1)',fill:'backwards'});done(a,g);
    }else if(kind==='turret'){
      const g=ghost(p.html,p.r,'shot');sfx('shot');
      const a=g.animate([{transform:'none',opacity:1,filter:'brightness(1)'},{transform:'translate(0,-10px) rotate(-8deg)',filter:'brightness(2.5)',offset:.12},{transform:`translate(${60+Math.random()*40}px,-140px) rotate(${200+Math.random()*200}deg) scale(.6)`,opacity:0,filter:'brightness(1)'}],{duration:d*2.1,easing:'cubic-bezier(.2,.6,.4,1)'});done(a,g);
      const f=document.createElement('div');f.className='muzzle';const c=ctr(p.r);Object.assign(f.style,{left:c.x+'px',top:c.y+'px'});fxLayer().appendChild(f);
      const b=f.animate([{opacity:1,transform:'translate(-50%,-50%) scale(.3)'},{opacity:0,transform:'translate(-50%,-50%) scale(2)'}],{duration:260});done(b,f);
    }else{
      const g=ghost(p.html,p.r,'dropped');
      const a=g.animate([{transform:'none',opacity:1},{transform:`translate(${(Math.random()-.5)*30}px,70px) rotate(${(Math.random()-.5)*40}deg) scale(.85)`,opacity:0}],{duration:d*1.6,delay,easing:'cubic-bezier(.4,0,.8,.6)',fill:'backwards'});done(a,g);
    }
  });
  // discards: the card skims off to the side
  if(kind==='discard'){
    const p=gone.find(([,p])=>p.zone==='hand'||p.zone==='fan');
    if(p){const g=ghost(p[1].html,p[1].r,'discarded');const a=g.animate([{transform:'none',opacity:1},{transform:`translate(${p[1].zone==='hand'?160:-160}px,${p[1].zone==='hand'?-30:30}px) rotate(${p[1].zone==='hand'?40:-40}deg)`,opacity:0}],{duration:d*1.4,easing:'cubic-bezier(.4,0,.6,1)'});done(a,g);}
  }
  // totals count up, sold stamps slam, busts shake
  setTimeout(()=>{
    document.querySelectorAll('#app [data-lv]').forEach(el=>{const was=prev.vals[el.dataset.lv],v=+el.dataset.val;if(was!=null&&was!==v&&was>=0&&v>=0)countUp(el,was,v,d*1.4);});
    document.querySelectorAll('#app .stampmark').forEach(el=>{if(!prev.sold.has(el.dataset.k)){el.classList.add('fresh');setTimeout(()=>{sfx('stamp');buzz(25);},120);}});
    document.querySelectorAll('#app .lane.isbust').forEach(el=>{if(!prev.bust.has(el.dataset.side+el.dataset.lane)){el.classList.add('bustshake');sfx('bust');}});
  },hitDelay+d*.5);
}

// ---------- caps: fly into the wallet and tick up ----------
let lastCapsShown=null;
function capsBurst(to,n,fromR){
  if(!motionOn()||!to)return;const tr=to.getBoundingClientRect(),tc=ctr(tr);
  const src=fromR?ctr(fromR):{x:innerWidth/2,y:innerHeight*.45};
  for(let i=0;i<Math.min(12,n);i++){
    const c=document.createElement('span');c.className='flycap';fxLayer().appendChild(c);
    const sx=src.x+(Math.random()-.5)*80,sy=src.y+(Math.random()-.5)*40;
    Object.assign(c.style,{left:sx+'px',top:sy+'px'});
    const mx=(sx+tc.x)/2+(Math.random()-.5)*120,my=Math.min(sy,tc.y)-60-Math.random()*60;
    const a=c.animate([{transform:'translate(-50%,-50%) scale(.6)',opacity:0},{transform:`translate(calc(${mx-sx}px - 50%),calc(${my-sy}px - 50%)) scale(1.1) rotate(180deg)`,opacity:1,offset:.45},{transform:`translate(calc(${tc.x-sx}px - 50%),calc(${tc.y-sy}px - 50%)) scale(.7) rotate(360deg)`,opacity:.9}],{duration:620+i*45,delay:i*55,easing:'cubic-bezier(.3,.6,.4,1)',fill:'backwards'});
    a.onfinish=()=>{c.remove();if(i%2===0)sfx('clink');};
  }
  setTimeout(()=>to.animate([{transform:'scale(1)'},{transform:'scale(1.18)'},{transform:'scale(1)'}],{duration:260}),620);
}
function capsTick(){
  const pills=[...document.querySelectorAll('#app [data-capsval]')];
  const key=['road','shop'].includes(screen)?'run':['campaign','vendor'].includes(screen)?'camp':screen;
  if(!pills.length||key==='match'){lastCapsShown=null;return;}
  const v=+pills[0].dataset.capsval;
  if(lastCapsShown&&lastCapsShown.key===key&&lastCapsShown.v!==v&&motionOn()){
    const from=lastCapsShown.v;
    pills.forEach((pill,i)=>{const num=pill.querySelector('.cn');if(num)countUp(num,from,v,700);if(i===0){if(v>from)capsBurst(pill,Math.ceil((v-from)/2));else pill.animate([{color:'#ff7a50'},{color:''}],{duration:700});}});
  }
  lastCapsShown={v,key};
}
function resultCaps(){
  const g=document.querySelector('#app .result .gain[data-delta]');if(!g||g.dataset.played)return;
  if(G&&G.over&&G.over.capsShown){g.dataset.played=1;return;}
  const n=+g.dataset.delta;if(!(n>0)||!motionOn())return;
  if(G&&G.over)G.over.capsShown=true;
  const num=g.querySelector('.cn');if(num)countUp(num,0,n,900);
  capsBurst(g,Math.min(12,Math.ceil(n/2)),{left:innerWidth/2-40,top:-40,width:80,height:40});
}

// ---------- screen transitions ----------
function screenIn(prevScreen){
  if(!motionOn()||prevScreen===screen)return;
  const app=document.getElementById('app');
  if(screen==='match')app.animate([{opacity:0,transform:'scale(.97)'},{opacity:1,transform:'none'}],{duration:280,easing:'ease-out'});
  else app.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:240,easing:'ease-out'});
}

// ---------- saloon lighting ----------
function ambience(){
  let a=document.getElementById('ambience');
  const on=screen==='match'&&meta&&meta.opt.ambience!==false;
  if(!on){if(a)a.remove();return;}
  if(a)return;
  a=document.createElement('div');a.id='ambience';a.setAttribute('aria-hidden','true');
  a.innerHTML='<div class="lamp"></div><div class="lampglow"></div>'+Array.from({length:5},(_,i)=>`<div class="smoke" style="--i:${i}"></div>`).join('');
  document.body.appendChild(a);
}

// ---------- bundles flip open, burned cards curl into embers ----------
function revealPicker(){
  const r=run&&run(),pk=r&&r.picker;if(!pk||pk.kind!=='bundle'||pk.revealed)return;
  pk.revealed=true;if(!motionOn())return;
  document.querySelectorAll('#app .pickcard').forEach((el,i)=>{el.style.pointerEvents='none';
    flipCover(el,starterBack(),420,180+i*150);
    el.animate([{transform:'translateY(-18px)',opacity:0},{transform:'none',opacity:1}],{duration:300,delay:i*150,fill:'backwards',easing:'ease-out'});
    setTimeout(()=>{el.style.pointerEvents='';sfx('snap');},400+i*150);});
}
function burnCards(els,cb){
  if(!motionOn()||!els.length){cb();return;}
  sfx('burn');
  els.forEach((el,i)=>{
    const card=el.querySelector('.card')||el,r=card.getBoundingClientRect(),g=ghost(card.outerHTML,r,'burning');el.style.visibility='hidden';
    const a=g.animate([{filter:'none',transform:'none',opacity:1},{filter:'sepia(1) brightness(.75) contrast(1.4)',transform:'rotate(-3deg)',offset:.35},{filter:'sepia(1) brightness(.25)',transform:'translateY(-14px) scale(.85,.6) rotate(6deg) skewX(8deg)',opacity:.85,offset:.75},{filter:'brightness(0)',transform:'translateY(-40px) scale(.4,.15)',opacity:0}],{duration:1100,delay:i*120,fill:'backwards',easing:'ease-in'});done(a,g);
    for(let k=0;k<14;k++){const e=document.createElement('span');e.className='ember';fxLayer().appendChild(e);
      const x=r.left+Math.random()*r.width,y=r.top+r.height*(.3+Math.random()*.7);Object.assign(e.style,{left:x+'px',top:y+'px'});
      const b=e.animate([{transform:'translate(0,0) scale(1)',opacity:0},{opacity:1,offset:.2},{transform:`translate(${(Math.random()-.5)*60}px,${-80-Math.random()*90}px) scale(.3)`,opacity:0}],{duration:900+Math.random()*700,delay:i*120+200+Math.random()*500,fill:'backwards',easing:'ease-out'});done(b,e);}
  });
  setTimeout(cb,1100+els.length*120);
}

// ---------- boss intro: a wanted poster ----------

// ---------- hand cards catch the light ----------
document.addEventListener('pointermove',e=>{
  const b=e.target.closest&&e.target.closest('.hand .card-btn, .pickcard, .offer .card');if(!b)return;
  const r=b.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;

function afterRender(prevScreen,prevSnap,fxNow){
  screenIn(prevScreen);
  ambience();
  if(screen==='match'){animateMatch(prevSnap,fxNow);if(G&&G.over)resultCaps();}
  if(typeof run==='function'&&run()&&run().picker)revealPicker();
  capsTick();
}


// ---------- illustrated court cards (Jack, Queen, King) and the Joker ----------
// Each court figure is drawn once per color, top half then mirrored, like a real double-ended court card.
function courtFigure(x,rank,red){
  const ink=red?'#8f1d18':'#1d2433', acc=red?'#c8342a':'#2c3e66', gold='#d9a43c', skin='#efc9a2', hair=red?'#6b3a1e':'#2a1d14';
  // shoulders / robe
  x.fillStyle=acc;x.beginPath();x.moveTo(6,84);x.quadraticCurveTo(14,58,38,54);x.lineTo(62,54);x.quadraticCurveTo(86,58,94,84);x.closePath();x.fill();
  x.fillStyle=gold;x.beginPath();x.moveTo(40,54);x.lineTo(50,72);x.lineTo(60,54);x.closePath();x.fill();
  x.fillStyle='#f4ead2';for(let i=0;i<6;i++){x.beginPath();x.arc(16+i*13,80,3,0,7);x.fill();}
  // neck + head
  x.fillStyle=skin;x.fillRect(44,44,12,12);
  x.beginPath();x.ellipse(50,34,15,17,0,0,7);x.fill();
  // face (vault-boy grin)
  const eyes=(y)=>{x.fillStyle='#fff';for(const s of [-1,1]){x.beginPath();x.ellipse(50+s*6,y,3,2.4,0,0,7);x.fill();}x.fillStyle='#111';for(const s of [-1,1]){x.beginPath();x.arc(50+s*6,y+.4,1.3,0,7);x.fill();}};
  if(rank==='K'){
    // bottle-cap crown
    x.fillStyle=gold;x.beginPath();x.moveTo(34,22);for(let i=0;i<=6;i++){x.lineTo(34+i*5.33,i%2?10:16);}x.lineTo(66,22);x.closePath();x.fill();
    for(let i=0;i<3;i++){x.fillStyle=i===1?acc:'#e8e2d4';x.beginPath();x.arc(40+i*10,18,3,0,7);x.fill();}
    x.fillStyle=hair;x.beginPath();x.ellipse(50,22,16,5,0,0,Math.PI);x.fill();
    eyes(32);
    // big mustache + beard
    x.fillStyle=hair;x.beginPath();x.moveTo(50,41);x.quadraticCurveTo(38,36,32,44);x.quadraticCurveTo(40,42,50,45);x.quadraticCurveTo(60,42,68,44);x.quadraticCurveTo(62,36,50,41);x.fill();
    x.beginPath();x.moveTo(38,44);x.quadraticCurveTo(50,62,62,44);x.quadraticCurveTo(50,50,38,44);x.fill();
    // scepter
    x.strokeStyle=gold;x.lineWidth=3;x.beginPath();x.moveTo(78,84);x.lineTo(86,40);x.stroke();x.fillStyle=gold;x.beginPath();x.arc(86,38,5,0,7);x.fill();
  }else if(rank==='Q'){
    // victory-roll hair
    x.fillStyle=hair;x.beginPath();x.ellipse(50,24,17,11,0,Math.PI,0);x.fill();
    x.beginPath();x.arc(38,20,7,0,7);x.arc(62,20,7,0,7);x.fill();
    x.beginPath();x.moveTo(34,30);x.quadraticCurveTo(28,46,36,52);x.lineTo(40,40);x.closePath();x.fill();
    x.beginPath();x.moveTo(66,30);x.quadraticCurveTo(72,46,64,52);x.lineTo(60,40);x.closePath();x.fill();

  x.strokeStyle='rgba(90,60,30,.14)';x.lineWidth=1;x.beginPath();x.moveTo(0,H*.52);x.lineTo(W,H*.48);x.stroke();
  for(let i=0;i<120;i++){x.fillStyle=`rgba(${r()<.5?'255,255,255':'70,45,20'},${r()*.18})`;const e=r()*4|0,t=r();const px=e<2?t*W:(e===2?r()*3:W-r()*3),py=e>=2?t*H:(e===0?r()*3:H-r()*3);x.fillRect(px,py,1.5,1.5);}

function loadCourtArt(){

// ---------- career state ----------
function careerInit(cp){
  if(cp.career)return cp;
  cp.career=1;cp.plus=cp.plus||0;cp.towns=cp.towns||1;cp.cbeat=cp.cbeat||[];cp.rep=cp.rep||{};cp.streak={};cp.trophies=cp.trophies||[];
  cp.tapes=cp.tapes||[];cp.chal=cp.chal||{};cp.seen=cp.seen||{};cp.story=cp.story||[];cp.stocks={};cp.lastBet={};cp.rec=cp.rec&&!Array.isArray(cp.rec)&&!('0' in cp.rec)?cp.rec:{};
  // older saves: convert the 8-dealer ladder into town progress
  const old=Array.isArray(cp.beaten)?cp.beaten.length:0;
  if(old){const cleared=Math.min(5,Math.floor(old*6/8));
    for(let t=0;t<cleared;t++){const T=TOWNS[t];cp.cbeat.push(`${T.id}:c`,`${T.id}:0`,`${T.id}:1`);cp.rep[T.id]=3;cp.seen[T.id]=1;
      if(!cp.trophies.some(x=>x.from===T.champ.name))cp.trophies.push({k:T.champ.trophy,from:T.champ.name,town:T.id,inDeck:false});
      if(!cp.tapes.includes(T.id))cp.tapes.push(T.id);}
    cp.towns=Math.min(6,cleared+1);
    cp.story.push({title:'The circuit got bigger',text:`The road to the High Table now runs through six towns, each with its own regulars, a champion, a high roller, a vendor and side challenges. Your collection, deck and caps came with you, and your old wins count: ${cleared?`you’ve already cleared ${cleared} town${cleared>1?'s':''}`:'pick up where you left off'}.`});
  }else cp.story.push({title:'A holotape, no label',text:OPENING_TAPE});
  cp.beaten=cp.beaten||[];
  return cp;
}
const CP=()=>{const cp=meta.classic.camp;return cp?careerInit(cp):null;};
const plusMul=()=>1+(CP().plus||0);
function dealerFor(id){
  const [tid,slot]=id.split(':'),ti=TOWNS.findIndex(t=>t.id===tid),T=TOWNS[ti];if(!T)return null;
  const base=slot==='c'?T.champ:slot==='h'?T.high:T.dealers[+slot];
  const p=CP().plus||0,extra={...base.extra};
  if(p){for(const r of ['J','K'])extra[r]=(extra[r]||0)+p;extra.JK=Math.min(2+p,(extra.JK||0)+1);}
  return {...base,id,ti,slot,town:T,max:Math.round(base.max*(1+p)),noise:Math.max(0.3,base.noise*Math.pow(0.55,p)),extra,
    place:`${T.venue}, ${T.name}`,kind:slot==='c'?'Champion':slot==='h'?'High roller':'Regular'};
}
const beatNow=id=>CP().cbeat.includes(id);
const regularsBeaten=T=>[0,1,2].filter(i=>beatNow(`${T.id}:${i}`)).length;
function dealerOpen(id){
  const d=dealerFor(id),T=d.town,cp=CP();
  if(d.ti>=cp.towns)return false;
  if(d.slot==='c')return regularsBeaten(T)>=2;
  if(d.slot==='h')return beatNow(`${T.id}:c`)&&(cp.rep[T.id]||0)>=6;
  return true;
}
function lockReason(id){
  const d=dealerFor(id),T=d.town,cp=CP();
  if(d.slot==='c')return `Beat ${2-regularsBeaten(T)} more regular${2-regularsBeaten(T)===1?'':'s'} here.`;
  if(d.slot==='h')return !beatNow(`${T.id}:c`)?`Beat ${T.champ.name} first.`:`Needs Respected reputation (${cp.rep[T.id]||0}/6).`;
  return '';
}
function campDeckSize(cp){return countsSize(cp.deck)+cp.trophies.filter(t=>t.inDeck).length;}
function campDeckSpec(){
  const cp=CP(),spec=withPacks(countsToSpec(cp.deck),packList());
  for(const t of cp.trophies)if(t.inDeck){const c=fromKeyC(t.k),T=TOWNS.find(x=>x.id===t.town);spec.push({...c,pack:T?T.back:'map',trophy:true});}
  return spec;
}
function rollTownStock(T,coll){
  const cp=CP(),w=T.lean,n=(cp.rep[T.id]||0)>=10?8:6;
  const weight=k=>{const c=fromKeyC(k),v=c.rank==='JK'?0:isNum(c)?val(c):0;let x=1;
    if(isNum(c)){x*=w.num||1;if(v<=4)x*=w.low||1;else if(v<=7)x*=w.mid||1;else x*=w.high||1;}
    else{x*=w.face||1;x*=w[c.rank]||1;}return x;};
  const pool=ALL_KEYS.filter(k=>(coll[k]||0)<capFor(k)),out=[];
  while(out.length<n&&pool.length){const tot=pool.reduce((a,k)=>a+weight(k),0);let r=Math.random()*tot,i=0;for(;i<pool.length;i++){r-=weight(pool[i]);if(r<=0)break;}out.push({k:pool.splice(Math.min(i,pool.length-1),1)[0],sold:false});}
  return out;
}
function townStock(T){const cp=CP();if(!cp.stocks[T.id])cp.stocks[T.id]=rollTownStock(T,cp.coll);return cp.stocks[T.id];}
const townPrice=(T,k)=>Math.max(1,Math.round(singlePrice(k)*repDiscount(CP().rep[T.id]||0)));

// ---------- starting a career match ----------
function startCareer(id,bet){
  const cp=CP(),d=dealerFor(id);
  if(!d||!dealerOpen(id)||bet>cp.caps||bet>d.max||campDeckSize(cp)<MIN_DECK)return;
  cp.caps-=bet;cp.lastBet[id]=bet;campPick=null;
  G=newMatch(campDeckSpec(),addFaces(baseNumbers(),d.extra),d.ti,baseRules());
  G.mode='campaign';G.stake=bet;G.cd={id,name:d.name,blurb:d.blurb,place:d.place,noise:d.noise,max:d.max,ti:d.ti,slot:d.slot};
  enterMatch();
}
function careerFinish(winner,ov,stake){
  const cp=CP(),d=G.cd,T=TOWNS[d.ti],lanes=lanesResult(G),r=cp.rec[d.id]||{w:0,l:0},p=cp.plus||0;
  const ctx={bet:stake,max:d.max,streak:0};ov.lines=[];
  if(winner==='p'){
    cp.caps+=stake*2;cp.wins++;r.w++;
    cp.streak[T.id]=(cp.streak[T.id]||0)+1;ctx.streak=cp.streak[T.id];
    const first=!beatNow(d.id);
    cp.rep[T.id]=Math.min(12,(cp.rep[T.id]||0)+(d.slot==='c'?2:d.slot==='h'?2:1));
    if(first){cp.cbeat.push(d.id);ov.firstBeat=true;}
    if(d.slot==='c'&&first){
      const purse=T.purse*(1+p);cp.caps+=purse;ov.lines.push(`Champion’s purse: ${purse} caps`);
      const C=T.champ;let text=C.post;
      if(!cp.trophies.some(t=>t.from===C.name)){cp.trophies.push({k:C.trophy,from:C.name,town:T.id,inDeck:true});ov.lines.push(`Trophy: ${TROPHY_NAME(C.trophy)} (added to your deck)`);}
      if(!cp.tapes.includes(T.id)){cp.tapes.push(T.id);text+=`\n\nHolotape: ${C.tape}`;}
      cp.story.push({title:p?`${C.name}, again`:C.name,text:p?`${C.name} pays out and shakes your hand. “Meaner every time around, aren’t you?”`:text});
      if(d.ti+1>=cp.towns&&d.ti<TOWNS.length-1){cp.towns=d.ti+2;const N=TOWNS[d.ti+1];ov.lines.push(`New town: ${N.name}`);}
      if(C.final){
        if(!cp.done){cp.done=true;ov.campDone=true;}
        cp.plus=p+1;cp.cbeat=[];cp.towns=1;cp.streak={};cp.stocks={};
        cp.story.push({title:`Circuit ${cp.plus+1}`,text:`Word gets around. Every dealer from Goodsprings to the Strip has studied your game, and the stakes have gone up. Dealers are sharper, decks carry more Kings and Jokers, table limits are ${cp.plus+1}× higher, and every challenge pays out again. Your collection, trophies and reputation carry over. Start in Goodsprings.`});
        ov.lines.push(`Circuit ${cp.plus+1} begins`);
      }
    }
    // side challenges, once per circuit
    const done=cp.chal[p]=cp.chal[p]||{};
    for(const cid of T.challenges){const key=`${T.id}:${cid}`;if(done[key])continue;
      if(CHALLENGES[cid].test(G,lanes,ctx)){done[key]=1;const pay=T.chal*(1+p);cp.caps+=pay;cp.rep[T.id]=Math.min(12,(cp.rep[T.id]||0)+1);ov.lines.push(`Challenge: ${CHALLENGES[cid].name} +${pay} caps`);}}
  }else{cp.losses++;r.l++;cp.streak[T.id]=0;}
  cp.rec[d.id]=r;cp.stocks={};
  ov.delta=winner==='p'?stake:-stake;
  if(winner==='p'&&cp.tab&&stake)ov.tabPaid=payTab(cp,Math.ceil(stake/2));
}

function handleCareerClick(d){
  const cp=meta.classic&&meta.classic.camp?CP():null;if(!cp)return false;
  if('storyok' in d){cp.story.shift();save();render();return true;}
  if('town' in d){townView=+d.town;campPick=null;screen='town';render();window.scrollTo(0,0);return true;}
  if('ctownvendor' in d){vendorTown=+d.ctownvendor;screen='vendor';render();window.scrollTo(0,0);return true;}
  if('cpick' in d){const id=d.cpick,dd=dealerFor(id);
    if(campPick!==id&&dd.slot==='c'&&!cp.seen[id+(cp.plus||0)]){cp.seen[id+(cp.plus||0)]=1;cp.story.push({title:dd.name,text:dd.pre});}
    campPick=campPick===id?null:id;save();render();return true;}
  if('cbet' in d){if(campPick)startCareer(campPick,+d.cbet);return true;}
  if('crebet' in d){const id=d.crebet;const bet=Math.min(cp.lastBet[id]||0,cp.caps);G=null;startCareer(id,bet);return true;}
  if('trophy' in d){const t=cp.trophies[+d.trophy];if(t){if(t.inDeck&&campDeckSize(cp)<=MIN_DECK)return true;t.inDeck=!t.inDeck;save();}render();return true;}
  if('newcircuit' in d){if(armedCut==='newcircuit'){meta.classic.camp=careerInit(freshCamp());armedCut=null;save();screen='campaign';}else armedCut='newcircuit';render();return true;}
  return false;
}

function miniCv(cards,{v,dir,tag,cls,label}={}){
  return `<div class="mcv ${cls||''}">${label?`<small>${label}</small>`:''}<div class="mcv-top"><b class="num">${v??''}</b>${dir?`<span>${dir}</span>`:''}${tag?`<i class="mtag ${tag.toLowerCase()}">${tag}</i>`:''}</div>
    <div class="mcv-stack">${cards.map((c,i)=>`<div class="mcv-card" style="top:${i*18}px">${typeof c==='string'?c:mc(c[0],c[1])}${c[2]?`<span class="mchip">${c[2]}</span>`:''}</div>`).join('')}</div></div>`;
}
const RUNDOWN=[
  {title:'The goal',body:`<p>You and the dealer each build <b>three caravans</b>, side by side. Each of your caravans faces one of theirs.</p>
    <p>A caravan <b>sells</b> when it’s worth <b>21 to 26</b> and beats the one across from it. Sell <b>two of three</b> and you win the hand.</p>`,
    art:()=>`<div class="mrow"><div class="mlab">Dealer</div>${miniCv([['10','S'],['9','S']],{v:19,tag:'Behind'})}${miniCv([['9','D','K'],['6','D']],{v:24,tag:'Ahead'})}${miniCv([['10','C'],['9','H'],['8','C']],{v:27,tag:'Bust'})}</div>
      <div class="mrow"><div class="mlab">You</div>${miniCv([['10','H'],['6','H'],['7','H']],{v:23,tag:'Ahead'})}${miniCv([['10','D'],['8','C']],{v:18,tag:'Behind'})}${miniCv([['7','S'],['8','D'],['10','S']],{v:25,tag:'Ahead'})}</div>
      <p class="mcap">You’re ahead in I and III. If it ends like this, you win 2–1.</p>`},
  {title:'Your hand and your turn',body:`<p>You start with <b>8 cards</b> from your deck. After that, you play <b>one card per turn</b> and draw back up to <b>5</b>.</p>
    <p>On your turn you do exactly one thing:</p>
    <ul><li><b>Play a number card</b> on one of your caravans.</li><li><b>Play a face card</b> on any caravan, yours or the dealer’s.</li><li><b>Discard</b> a card from your hand.</li><li><b>Disband</b> one of your caravans, clearing it to start over.</li></ul>`,
    art:()=>`<div class="mhand">${[['4','S'],['9','H'],['K','C'],['Q','D'],['2','H']].map(c=>mc(c[0],c[1])).join('')}</div>`},
  {title:'The opening',body:`<p>Your first <b>three turns</b> are the opening. Each turn you must start one of your empty caravans with a <b>number card</b>.</p>
    <p>No face cards, discards or disbands until all three caravans have a card.</p>`,
    art:()=>`<div class="mrow">${miniCv([['7','S']],{v:7,label:'Turn 1'})}${miniCv([['3','H']],{v:3,label:'Turn 2'})}${miniCv([['A','D']],{v:1,label:'Turn 3'})}</div>`},
  {title:'Number cards and direction',body:`<p>Aces are 1, numbers are face value. A caravan’s worth is the cards added up.</p>
    <p>The <b>second card sets the direction</b>: higher than the first is <b>▲ up</b>, lower is <b>▼ down</b>. Every card after that has to keep going that way.</p>
    <p>Two exceptions: a card of the caravan’s <b>suit</b> can always go on, either way. And you can never play the <b>same value</b> as the top card.</p>`,
    art:()=>`<div class="mrow">${miniCv([['4','S'],['7','H']],{v:11,dir:'▲ ♥',label:'Going up'})}<div class="mrules"><span class="ok">9♣ ✓ higher</span><span class="no">5♣ ✗ lower</span><span class="ok">2♥ ✓ same suit</span><span class="no">7♦ ✗ same value</span></div></div>`},
  {title:'Face cards',body:`<p>Face cards attach to a card already in a caravan, <b>yours or the dealer’s</b>.</p>
    <ul><li><b>King:</b> adds that card’s value again. Two Kings on a 6 makes 24.</li><li><b>Queen:</b> top card only. Flips the direction and changes the suit.</li><li><b>Jack:</b> removes the card it’s on, and anything attached to it.</li><li><b>Joker:</b> on a 2–10, removes every other card of that value from the table. On an Ace, every other card of that suit.</li></ul>`,
    art:()=>`<div class="mrow">${miniCv([['8','D','K'],['10','D']],{v:26,label:'King on the 8'})}${miniCv([['3','C'],['6','C','Q♥']],{v:9,dir:'▼ ♥',label:'Queen flips it'})}${miniCv([['5','S'],['9','S','J']],{v:'14→5',label:'Jack on the 9'})}</div>`},
  {title:'Busting and messing with the dealer',body:`<p>Over 26 is a <b>bust</b>. A busted caravan can’t sell until you bring it back down, with a Jack or by disbanding.</p>
    <p>You can’t put number cards on the dealer’s caravans, but face cards go anywhere. A <b>King on their big card</b> is the classic way to bust them. They’ll do it to you, too.</p>`,
    art:()=>`<div class="mrow"><div class="mlab">Dealer</div>${miniCv([['10','S'],['8','S','K']],{v:26})}<span class="marrow">→</span>${miniCv([['10','S'],['8','S','K K']],{v:34,tag:'Bust'})}</div><p class="mcap">One more King on their 8 and their 26 becomes 34.</p>`},
  {title:'How the hand ends',body:`<p>The hand ends only when <b>all three matchups are settled at the same time</b>: in each pair, one side is at 21–26 and beats the other.</p>
    <p>An exact tie, both sides under 21, or both busting doesn’t count yet. Then whoever sold <b>two or three</b> caravans wins, and the winners get stamped <b>SOLD</b>.</p>
    <p>During play, tags show <b>AHEAD</b> and <b>BEHIND</b>. Nothing is final until the end.</p>`,
    art:()=>`<div class="mrow">${miniCv([['10','H'],['9','C']],{v:19,tag:'Behind',label:'Not settled'})}${miniCv([['9','S'],['8','H'],['7','S']],{v:24,tag:'Ahead',label:'Settled'})}${miniCv([['10','D'],['3','D']],{v:13,label:'Not settled'})}</div><p class="mcap">Only one matchup is settled here, so play goes on.</p>`},
  {title:'Ready to play',body:`<p>That’s the whole game. Now Old Ezra will deal you a real hand and walk you through it <b>one move at a time</b>, explaining why each play makes sense.</p>
    <p>You can reopen this rundown any time from the help screen, and every game has a <b>Rules</b> button at the top.</p>`,
    art:()=>`<div class="mhand">${[['10','H'],['K','S'],['Q','D'],['J','C']].map(c=>mc(c[0],c[1])).join('')}${cardHTML({rank:'JK'})}</div>`},
];
function openRundown(then){rundownThen=then||null;rundownStep=0;screen='rundown';render();window.scrollTo(0,0);}
function renderRundown(){
  const n=RUNDOWN.length,i=Math.max(0,Math.min(rundownStep,n-1)),R=RUNDOWN[i],last=i===n-1;
  app.innerHTML=`
  <div class="mbar">${backBtn(rundownThen==='road'?'road':rundownThen==='classic'?'classic':'help','Back')}<span class="pill num">${i+1} / ${n}</span></div>
  <section class="panel rundown">
    <div class="rd-dots">${RUNDOWN.map((_,k)=>`<i class="${k===i?'on':k<i?'past':''}"></i>`).join('')}</div>
    <h2>${esc(R.title)}</h2>
    <div class="rd-art">${R.art()}</div>
    <div class="rd-body">${R.body}</div>
    <div class="rd-nav">
      <button class="btn" data-rd="prev" ${i?'':'disabled'}>← Back</button>
      ${last?(rundownThen?`<button class="btn hot" data-rd="start">Start guided play</button>`:`<button class="btn hot" data-go="help">Done</button>`):`<button class="btn hot" data-rd="next">Next →</button>`}
    </div>
    ${rundownThen&&!last?`<button class="btn ghost rd-skip" data-rd="start">Skip to guided play</button>`:''}
  </section>`;
}
function handleRundownClick(d){
  if('rundown' in d){openRundown(null);return true;}
  if(!('rd' in d))return false;
  if(d.rd==='next')rundownStep++;
  else if(d.rd==='prev')rundownStep=Math.max(0,rundownStep-1);
  else if(d.rd==='start'){const t=rundownThen;rundownThen=null;if(t==='classic')startClassic(-1,true);else startMatch(-1,true);return true;}
  render();window.scrollTo(0,0);return true;
}

// ---------- boot ----------
function start(data){
  meta=migrate((data&&data.meta)||load()||freshMeta());
  if(data&&data.G){G=data.G;screen=data.screen||'home';}
  else if(meta.match&&!meta.match.over){G=meta.match;screen='match';}
  else screen=(data&&data.screen)||'home';
  if(screen==='match'&&!G)screen='home';
  achSilent=true;const retro=checkState();achSilent=false;
  if(retro>0){save();setTimeout(()=>toast({name:`${retro} achievement${retro>1?'s':''} from past play`,desc:'Open Achievements to see them.'}),900);}if(screen==='hub')screen='road';
  if(G&&!G.rules)G.rules=baseRules();
  applyLook();if(!window.__art){window.__art=1;initArt();try{loadDeckTextures();}catch(e){}try{loadCourtArt();}catch(e){console.warn(e);}try{loadPortraitFiles();}catch(e){}}
  if(meta.convertNote!=null){const n=meta.convertNote;delete meta.convertNote;save();setTimeout(()=>toast({label:'Update',name:'The Road is now a roguelite',desc:n?`Your old progress became ${n} starting token${n>1?'s':''}. Pick one when you start a run.`:'Every run starts fresh with the Plain deck.'}),1200);}drawSky();render();
  if(screen==='match'&&G&&!G.over&&G.turn==='a'){busy=true;render();setTimeout(aiTurn,600);}
}
window.claude?.hot?.snapshot?.(()=>({meta,G,screen}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
initSync();
</script>
</body>
